name: Deploy the local k3s lab

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-local-k3s
  cancel-in-progress: false

jobs:
  verify-ci:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Require successful push CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f status=success -f head_sha="$GITHUB_SHA" \
            -F per_page=1 --jq '.workflow_runs[0].html_url // empty')
          if [[ -z "$run_url" ]]; then
            echo "::error::No successful main push CI run for $GITHUB_SHA"
            exit 1
          fi
          echo "Verified CI: $run_url"

  deploy:
    needs: verify-ci
    runs-on: [self-hosted, k3s-lab]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Deploy and verify the local lab
        run: bash ./scripts/deploy-k3s.sh
