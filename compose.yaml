services:
  demo:
    image: devops-demo:local
    build: .
    ports:
      - "127.0.0.1:${DEMO_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 10
